name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: greencode
          POSTGRES_PASSWORD: greencode
          POSTGRES_DB: greencode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greencode" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: psql postgresql://greencode:greencode@localhost:5432/greencode -f database/seed/bench_dataset.sql
      - run: cd backend && pytest
        env:
          GREENCODE_LLM_PROVIDER: mock
          GREENCODE_BENCHMARK_REPETITIONS: "5"
          GREENCODE_BENCHMARK_WARMUP_RUNS: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm install && npm run build
