<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="Helvetica, Arial, sans-serif">
<rect width="1200" height="640" fill="white"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#000"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#000"/></marker></defs>
<text x="600.0" y="30" text-anchor="middle" font-size="18" font-weight="700">GreenCode – where everything runs</text>
<rect x="60" y="60" width="860" height="500" rx="22" fill="#FAFAF8" stroke="#555" stroke-width="2.5"/>
<rect x="300" y="560" width="380" height="14" rx="4" fill="#DDD" stroke="#555" stroke-width="2"/>
<text x="490" y="86" text-anchor="middle" font-size="13" font-weight="600" fill="#333">One Windows 11 laptop  ·  Intel Core Ultra 5 135U  ·  32 GB RAM  ·  plugged in, power mode fixed</text>
<rect x="100" y="120" width="220" height="90" rx="10" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.5"/>
<text x="210.0" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#000">Dashboard</text>
<text x="210.0" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#000">web page in the browser</text>
<text x="210.0" y="182" text-anchor="middle" font-size="11" font-weight="400" fill="#000">shows findings and results</text>
<rect x="390" y="120" width="220" height="90" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="500.0" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#000">GreenCode backend</text>
<text x="500.0" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#000">runs the pipeline:</text>
<text x="500.0" y="182" text-anchor="middle" font-size="11" font-weight="400" fill="#000">analyse · rewrite · verify · benchmark</text>
<rect x="680" y="120" width="210" height="90" rx="10" fill="#E1D5E7" stroke="#9673A6" stroke-width="1.5"/>
<text x="785.0" y="146" text-anchor="middle" font-size="14" font-weight="700" fill="#000">Local AI model</text>
<text x="785.0" y="166" text-anchor="middle" font-size="11" font-weight="400" fill="#000">Ollama · qwen2.5-coder:7b</text>
<text x="785.0" y="182" text-anchor="middle" font-size="11" font-weight="400" fill="#000">never leaves the laptop</text>
<rect x="100" y="330" width="220" height="100" rx="10" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
<text x="210.0" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#000">Sandbox</text>
<text x="210.0" y="376" text-anchor="middle" font-size="11" font-weight="400" fill="#000">separate, locked-down process</text>
<text x="210.0" y="392" text-anchor="middle" font-size="11" font-weight="400" fill="#000">runs the candidate code safely</text>
<rect x="390" y="330" width="220" height="100" rx="10" fill="#D5E8D4" stroke="#82B366" stroke-width="1.5"/>
<text x="500.0" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#000">Database</text>
<text x="500.0" y="376" text-anchor="middle" font-size="11" font-weight="400" fill="#000">PostgreSQL 18</text>
<text x="500.0" y="392" text-anchor="middle" font-size="11" font-weight="400" fill="#000">every result and sample stored</text>
<rect x="680" y="330" width="210" height="100" rx="10" fill="#FFF2CC" stroke="#D6B656" stroke-width="1.5"/>
<text x="785.0" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#000">Power meter</text>
<text x="785.0" y="376" text-anchor="middle" font-size="11" font-weight="400" fill="#000">LibreHardwareMonitor reads</text>
<text x="785.0" y="392" text-anchor="middle" font-size="11" font-weight="400" fill="#000">the CPU&#x27;s energy counters</text>
<line x1="320" y1="165" x2="390" y2="165" stroke="#000" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#b)"/>
<rect x="306.2" y="149.0" width="97.60000000000001" height="15" fill="white"/>
<text x="355.0" y="160.0" text-anchor="middle" font-size="11" font-weight="400" fill="#000">clicks / pages</text>
<line x1="610" y1="165" x2="680" y2="165" stroke="#000" stroke-width="1.3" marker-end="url(#a)" marker-start="url(#b)"/>
<rect x="577.0" y="149.0" width="136.0" height="15" fill="white"/>
<text x="645.0" y="160.0" text-anchor="middle" font-size="11" font-weight="400" fill="#000">code in, rewrite out</text>
<line x1="500" y1="210" x2="500" y2="330" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="511.20000000000005" y="254.0" width="97.60000000000001" height="15" fill="white"/>
<text x="560" y="265.0" text-anchor="middle" font-size="11" font-weight="400" fill="#000">saves evidence</text>
<line x1="430" y1="210" x2="210" y2="330" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="257.2" y="252" width="65.6" height="15" fill="white"/>
<text x="290" y="263" text-anchor="middle" font-size="11" font-weight="400" fill="#000">runs code</text>
<line x1="570" y1="210" x2="785" y2="330" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="660.8" y="252" width="78.4" height="15" fill="white"/>
<text x="700" y="263" text-anchor="middle" font-size="11" font-weight="400" fill="#000">reads watts</text>
<rect x="705" y="470" width="160" height="60" rx="6" fill="#EEE" stroke="#777" stroke-width="1.5"/>
<text x="785" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#000">CPU</text>
<text x="785" y="512" text-anchor="middle" font-size="10.5" font-weight="400" fill="#000">energy counters (RAPL)</text>
<line x1="785" y1="430" x2="785" y2="470" stroke="#000" stroke-width="1.3" marker-end="url(#a)"/>
<rect x="781.0" y="434.0" width="8.0" height="15" fill="white"/>
<text x="785.0" y="445.0" text-anchor="middle" font-size="11" font-weight="400" fill="#000"></text>
<rect x="970" y="150" width="190" height="80" rx="10" fill="#F5F5F5" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1065.0" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#000">GitHub</text>
<text x="1065.0" y="196" text-anchor="middle" font-size="11" font-weight="400" fill="#000">source code and docs</text>
<text x="1065.0" y="212" text-anchor="middle" font-size="11" font-weight="400" fill="#000">(not used during runs)</text>
<rect x="970" y="330" width="190" height="80" rx="10" fill="#F5F5F5" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1065.0" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#000">Zotero</text>
<text x="1065.0" y="376" text-anchor="middle" font-size="11" font-weight="400" fill="#000">references for the report</text>
<text x="1065.0" y="392" text-anchor="middle" font-size="11" font-weight="400" fill="#000">(not used during runs)</text>
<text x="1065" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#666">Outside the laptop</text>
<text x="1065" y="450" text-anchor="middle" font-size="11.5" font-weight="600" fill="#666">No cloud, no containers:</text>
<text x="1065" y="467" text-anchor="middle" font-size="11" font-weight="400" fill="#666">energy can only be read on the</text>
<text x="1065" y="483" text-anchor="middle" font-size="11" font-weight="400" fill="#666">machine that runs the code</text>
</svg>