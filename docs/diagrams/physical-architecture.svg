<text x="620.0" y="540" text-anchor="middle" font-size="13" fill="#333">CPU with RAPL energy counters (package, cores, memory, platform) · psutil reads CPU time and working set per process</text>
<text x="620.0" y="558" text-anchor="middle" font-size="13" fill="#333">Windows power mode (Best efficiency / Balanced / Best performance) decides P-core vs E-core placement and frequency</text>
