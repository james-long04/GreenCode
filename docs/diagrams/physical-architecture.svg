<line x1="185" y1="420" x2="185" y2="490" stroke="#444" stroke-width="1.8" marker-end="url(#a)"/>
<text x="185.0" y="451.0" text-anchor="middle" font-size="12" fill="#444">psutil</text>
<text x="40" y="628" font-size="13" fill="#555">Outside the laptop only: GitHub (source + docs), Zotero (references). No cloud, no containers — measurements need direct access to the hardware counters.</text>
